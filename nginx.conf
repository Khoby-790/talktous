server {
  listen 80;
  root /usr/share/nginx/html;

  # Fingerprinted assets: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # "/" is prerendered (index.html); every other route is client-side and
  # falls back to the SPA shell. Serving index.html there would hydrate the
  # landing page markup on top of, say, /dashboard.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /__spa-fallback.html;
  }
}
